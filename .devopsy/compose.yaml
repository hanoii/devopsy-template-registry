# A private Docker registry (CNCF distribution) behind devopsy-template-traefik, with
# htpasswd authentication: a user that pushes and pulls (REGISTRY_USER,
# default devopsy) and one that only pulls (REGISTRY_PULL_USER, default
# pull), for the servers that run the images. Images live in ./mnt/registry
# (on servers shared/mnt/registry).
#
# REGISTRY_PASSWORD, REGISTRY_PULL_PASSWORD and REGISTRY_HTTP_SECRET are
# secrets in .devopsy/.env (on servers shared/.env). `devopsy secrets`
# generates them (a release runs it before going live), and `deploy` writes
# ./mnt/auth/htpasswd for both users, and REGISTRY_PUSH_USERS into .env for
# Traefik (below).
services:
  registry:
    image: registry:3.1.2
    restart: unless-stopped
    # Not root, not the deploy user (1000): see "Conventions" in the devopsy
    # workspace README. init gives it the storage directory.
    user: "10001:10001"
    read_only: true
    environment:
      REGISTRY_AUTH: htpasswd
      REGISTRY_AUTH_HTPASSWD_REALM: ${COMPOSE_PROJECT_NAME:-registry}
      REGISTRY_AUTH_HTPASSWD_PATH: /auth/htpasswd
      # Signs upload state between requests; must not change during uploads.
      REGISTRY_HTTP_SECRET: ${REGISTRY_HTTP_SECRET:?run devopsy secrets to generate it}
      # Lets `docker manifest`/API deletes remove tags, so gc can free space.
      REGISTRY_STORAGE_DELETE_ENABLED: "true"
      # No OpenTelemetry collector here: do not try to send traces.
      OTEL_TRACES_EXPORTER: none
      REGISTRY_LOG_LEVEL: info
    volumes:
      - ./mnt/registry:/var/lib/registry
      - ./mnt/auth:/auth:ro
    depends_on:
      init:
        condition: service_completed_successfully
    healthcheck:
      # / answers 200 without credentials; /v2/ needs them.
      test: [CMD, wget, -q, -O, /dev/null, http://localhost:5000/]
      interval: 10s
      start_period: 10s
      start_interval: 1s
    labels:
      # Each release gets the server's wildcard domain from its proxy
      # (devopsy-template-traefik exports it), for <project>-<environment>.<domain>. Without a
      # proxy running the release fails: the project expects one.
      - devopsy.import.DEVOPSY_WILDCARD_DOMAIN=proxy/WILDCARD_DOMAIN
      - traefik.enable=true
      # The registry's htpasswd has no scopes: every user in it pushes. The
      # pull user is read-only because Traefik splits requests by method:
      # pulls are GET and HEAD (manifests, blobs, the catalog); everything
      # else (POST, PATCH, PUT, DELETE: uploads, tags, deletes) goes through
      # a basic auth of the push user alone, before the registry checks the
      # same header again. The pull router's rule is longer, so Traefik
      # gives it priority.
      #
      # SITE_HOST_RULE: the target's DEVOPSY_DOMAINS plus
      # <compose project>.<DEVOPSY_WILDCARD_DOMAIN>, computed by
      # capabilities/env/compute. The fallback, for plain docker compose, is
      # a HostRegexp: Traefik requests no certificate for it, so a target
      # without hosts logs no ACME errors.
      - traefik.http.routers.${COMPOSE_PROJECT_NAME:-app}-pull.rule=(${SITE_HOST_RULE:-HostRegexp(`^app\.localhost$`)}) && (Method(`GET`) || Method(`HEAD`))
      - traefik.http.routers.${COMPOSE_PROJECT_NAME:-app}-pull.service=${COMPOSE_PROJECT_NAME:-app}
      - traefik.http.routers.${COMPOSE_PROJECT_NAME:-app}.rule=${SITE_HOST_RULE:-HostRegexp(`^app\.localhost$`)}
      - traefik.http.routers.${COMPOSE_PROJECT_NAME:-app}.service=${COMPOSE_PROJECT_NAME:-app}
      - traefik.http.routers.${COMPOSE_PROJECT_NAME:-app}.middlewares=${COMPOSE_PROJECT_NAME:-app}-push
      # REGISTRY_PUSH_USERS: the push user's line of mnt/auth/htpasswd
      # (user:bcrypt), written to .env by deploy before `up`, in single
      # quotes: compose expands $ in unquoted values. Not required here: a
      # release checks required variables before deploy writes it.
      - traefik.http.middlewares.${COMPOSE_PROJECT_NAME:-app}-push.basicauth.users=${REGISTRY_PUSH_USERS:-}
      # letsencrypt1 (HTTP-01, the default), acmedns or cloudflare (DNS-01),
      # per target, in config.yaml.
      - traefik.http.routers.${COMPOSE_PROJECT_NAME:-app}-pull.tls.certresolver=${CERTRESOLVER:-letsencrypt1}
      - traefik.http.routers.${COMPOSE_PROJECT_NAME:-app}.tls.certresolver=${CERTRESOLVER:-letsencrypt1}
      - traefik.http.services.${COMPOSE_PROJECT_NAME:-app}.loadbalancer.server.port=5000
    networks: [default, traefik]

  # shared/mnt belongs to the deploy user and Docker creates a missing
  # bind-mount directory as root: hand the storage to the registry's UID.
  init:
    image: registry:3.1.2
    user: root
    entrypoint: [chown, "10001:10001", /var/lib/registry]
    volumes:
      - ./mnt/registry:/var/lib/registry
    network_mode: none

  # `devopsy deploy` hashes the password with it (bcrypt, which the registry
  # requires). Never started by `up`.
  htpasswd:
    image: httpd:2.4.69-alpine
    profiles: [tools]
    entrypoint: [htpasswd]
    network_mode: none

  # `devopsy crane`, `images` and `delete` reach the registry with it, as
  # the push user, inside the project's network: registry:5000, plain
  # HTTP, never through Traefik. The entrypoint logs in, then runs the
  # command it is given. The debug image has a shell. Never started by
  # `up`. The login only writes crane's config, so its output goes.
  crane:
    image: gcr.io/go-containerregistry/crane/debug:v0.22.1
    profiles: [tools]
    environment:
      REGISTRY_USER: ${REGISTRY_USER:-devopsy}
      REGISTRY_PASSWORD: ${REGISTRY_PASSWORD:-}
    entrypoint:
      - sh
      - -c
      - printf '%s' "$$REGISTRY_PASSWORD" | crane auth login registry:5000 -u "$$REGISTRY_USER" --password-stdin >/dev/null 2>&1 && exec "$$@"
      - crane

networks:
  traefik:
    name: traefik
    external: true
